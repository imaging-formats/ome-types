# run locally with `uv run prek run --all-files` (https://prek.j178.dev/)
# hook versions are kept up to date by dependabot (see .github/dependabot.yml)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
        args: [--unsafe] # mkdocs.yml uses custom python tags
      - id: end-of-file-fixer
        exclude: ^tests/data/
      - id: trailing-whitespace
        exclude: ^tests/data/

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: "0.26"
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor

  - repo: https://github.com/adhtruong/mirrors-typos
    rev: v1.51.1
    hooks:
      - id: typos
        args: [--force-exclude] # omit --write-changes

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix, --unsafe-fixes]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        exclude: ^tests|^docs|_napari_plugin|widgets
        additional_dependencies:
          - pydantic>=2.10
          - xsdata==26.2  # within `build` extra range used by ome_autogen
          - Pint
          - types-lxml
