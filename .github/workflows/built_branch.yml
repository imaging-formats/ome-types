name: Build built branch

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to force-push the `built` branch
    steps:
      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true # needed to push the `built` branch below

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: false

      - name: Build wheel
        run: uv build --wheel

      - name: Replace working tree with wheel
        run: |
          shopt -s extglob
          rm -rf !("dist"|"*.git")
          unzip -o dist/*.whl -d .
          rm -rf dist ./*.dist-info ./.github* ./.gitignore ./.r* ./.p*

      - name: Commit files
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -am "Built wheel"

      - name: Push to built branch
        run: git push --force origin HEAD:refs/heads/built
