# https://peps.python.org/pep-0517/
[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# https://peps.python.org/pep-0621/
[project]
name = "ome-types"
description = "Python dataclasses for the OME data model"
keywords = ["ome", "ome-model", "microscopy", "schema", "types"]
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Talley Lambert", email = "talley.lambert@gmail.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dynamic = ["version"]
dependencies = [
  "pydantic >=2.4.0",
  "pydantic-core>=2.20.0; python_version>='3.13'",
  "pydantic_extra_types >=2.0.0",
  "xsdata >=24.4",
]

[project.urls]
Source = "https://github.com/imaging-formats/ome-types"
Tracker = "https://github.com/imaging-formats/ome-types/issues"
Documentation = "https://ome-types.readthedocs.io/en/latest/"

[project.entry-points."napari.manifest"]
ome-types = "ome_types:napari.yaml"

# extras
# https://peps.python.org/pep-0621/#dependencies-optional-dependencies
[project.optional-dependencies]
pint = [
  "Pint >=0.15",
  "pint >=0.25; python_version >= '3.13'", # pint has issues with older numpy...
]
lxml = [
  "lxml >=4.8.0",
  "lxml >=5.0; python_version >= '3.11'",
  "lxml >=5.3; python_version >= '3.13'",
]
# Keep build here for hatch compatibility
build = ["ruff ==0.13.2", "xsdata[cli] ==25.7"]

# https://peps.python.org/pep-0735/
[dependency-groups]
test = [
  "ome-types[lxml,pint]",
  "coverage >=6.4.4",
  "numpy >=1.26.0",
  "numpy >=2.1; python_version >= '3.13'",
  "pytest-codspeed >=2.4.0",
  "pytest-cov >=4.0.0",
  "pytest-mypy-plugins >=3.0.0",
  "pytest >=7.0.0",
  "xmlschema >=2.0.0,<2.5",
  "xmlschema >=2.3.0,<2.5; python_version >= '3.12'",
  "xsdata[cli] >=24.4",
]
test-qt = [{ include-group = 'test' }, "qtpy >=2.4.0", "pytest-qt >=4.4.0"]
docs = ["mkdocs-material >=9.0.0", "mkdocstrings-python >=1.0.0"]
dev = [
  { include-group = "test" },
  { include-group = "docs" },
  "pdbpp >=0.10.0; sys_platform != 'win32'",
  "types-lxml >=2023.1.1",
  "ruff>=0.11.5",
  "mypy>=1.18.2",
  "pre-commit-uv>=4.1.5",
]

[tool.uv.sources]
ome-types = { workspace = true }

# https://hatch.pypa.io/latest/plugins/build-hook/custom/
[tool.hatch.build.targets.wheel.hooks.custom]
# requirements to run the autogen script in hatch_build.py
require-runtime-dependencies = true
require-runtime-features = ["build"]

# https://hatch.pypa.io/latest/config/metadata/
[tool.hatch]
version = { source = "vcs" }

[tool.hatch.build.targets.wheel]
only-include = ["src/ome_types", "src/xsdata_pydantic_basemodel"]
sources = ["src"]
artifacts = ["src/ome_types/_autogenerated"]

[tool.hatch.build.targets.sdist]
include = ["src", "CHANGELOG.md", "hatch_build.py"]
exclude = ["src/ome_types/_autogenerated"]


# https://github.com/charliermarsh/ruff
[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py39"
exclude = ['src/_ome_autogen.py', 'src/ome_types/_vendor']

[tool.ruff.lint]
pydocstyle = { convention = "numpy" }
select = [
  "E",      # style errors
  "W",      # style warnings
  "F",      # flakes
  "D",      # pydocstyle
  "D417",   # Missing argument descriptions in Docstrings
  "I",      # isort
  "UP",     # pyupgrade
  "S",      # bandit
  "C4",     # flake8-comprehensions
  "B",      # flake8-bugbear
  "A001",   # flake8-builtins
  "RUF",    # ruff-specific rules
  "SIM105", # contextlib.suppress
  "TID",    # tidy imports
  "TC",     # flake8-type-checking
]
ignore = [
  "D104", #  Missing docstring in public package
  "D401", # First line should be in imperative mood
  "D404", # First word should not be 'This'
  "D401", # First line should be in imperative mood
  "D100", # Missing docstring in public module
  "S3",   # Using `xml` to parse untrusted data is known to be vulnerable to XML attacks
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all" # Disallow all relative imports.

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D", "S"]
"src/ome_autogen/*.py" = ["D10", "E501"]
".github/*.py" = ["D"]
"setup.py" = ["D"]
"docs/**/*.py" = ["D"]
"src/xsdata_pydantic_basemodel/**/*.py" = ["D"]

# https://docs.astral.sh/ruff/formatter/
[tool.ruff.format]
docstring-code-format = true

[tool.check-manifest]
ignore = [
  "coverage.yml",
  ".pre-commit-config.yaml",
  ".github_changelog_generator",
  ".readthedocs.yml",
  "mkdocs.yml",
  "docs/**/*",
  "tests/**/*",
  "typesafety/**/*",
]

# https://docs.pytest.org/en/6.2.x/customize.html
[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
addopts = '--mypy-only-local-stub --color=yes'
filterwarnings = [
  "error",
  "ignore:Casting invalid AnnotationID:UserWarning",
  # FIXME: i think this might be an xsdata issue?
  "ignore::ResourceWarning",
  "ignore:pkg_resources is deprecated",                # paquo tests
  "ignore:::paquo",                                    # paquo tests
  "ignore:the imp module is deprecated",               # omero tests
  "ignore:Failing to pass a value:DeprecationWarning", # xsdata
]

# https://mypy.readthedocs.io/en/stable/config_file.html
[tool.mypy]
files = "src/**/*/*.py"
follow_imports = 'silent'
strict_optional = true
warn_redundant_casts = true
# warn_unused_ignores = true
disallow_any_generics = false
no_implicit_reexport = true
ignore_missing_imports = true
disallow_untyped_defs = true
plugins = "pydantic.mypy"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = false       # allow parsing Any

[[tool.mypy.overrides]]
module = ['ome_types._autogenerated.ome_2016_06.structured_annotations']
# Definition of "__iter__" in base class "BaseModel"
# is incompatible with definition in base class "Sequence"
disable_error_code = "misc"

# https://coverage.readthedocs.io/en/6.4/config.html
[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "@overload",
  "except ImportError",
  "\\.\\.\\.",
  "raise NotImplementedError()",
]

[tool.coverage.run]
source = ["ome_types", "ome_autogen"]
omit = [
  "src/ome_types/_autogenerated/*",
  "/private/var/folders/*",
  "*/_vendor/*",
  "src/ome_types/widget.py",
]

[tool.typos.default]
extend-ignore-identifiers-re = ["(?i)nd2?.*", "(?i)ome", ".*ser_schema"]

[tool.typos.files]
extend-exclude = ["*.xsd", "*.xml", "*.xsl", "*.json"]

# Entry points -- REMOVE ONCE XSDATA-PYDANTIC-BASEMODEL IS SEPARATE
[project.entry-points."xsdata.plugins.class_types"]
xsdata_pydantic_basemodel = "xsdata_pydantic_basemodel.hooks.class_type"

[project.entry-points."xsdata.plugins.cli"]
xsdata_pydantic_basemodel = "xsdata_pydantic_basemodel.hooks.cli"
